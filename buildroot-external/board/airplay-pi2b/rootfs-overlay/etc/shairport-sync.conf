general = {
    name = "Wohnzimmer Pi2B";      // so erscheint das Gerät im AirPlay-Menü
                                     // (eigener Name, falls parallel zum
                                     // Zero-2-W-Gerät im selben Netz aktiv)
    interpolation = "soxr";       // braucht die aktivierte soxr-Option
};

alsa = {
    output_device = "plugequal_fixed";  // plug -> hw:0,0 (siehe asound.conf)
    // Bewusst KEIN mixer_control_name: shairport nutzt dann Software-Volume,
    // und der per S99shairport-sync fest gesetzte Hardware-Pegel ("Digital",
    // -6dB) wirkt als unueberschreitbarer Lautstaerke-Deckel - volle
    // iPhone-Lautstaerke kann nie lauter werden als dieser Wert.
};
