# ALSA-Routing fuer den HiFiBerry Amp4 - direkter Pfad ohne Software-EQ.
#
# Der urspruenglich geplante statische LADSPA-EQ (Anhang B der Anleitung,
# caps/Eq10 via "type ladspa") ist mit alsa-lib 1.2.x kaputt: die
# hw-Parameter-Aushandlung ueber der ladspa-Schicht crasht mit
# "Assertion !snd_interval_empty(i) failed" (auf echter Hardware
# verifiziert, auch mit policy duplicate). Bis dafuer eine Loesung steht
# (explizite Kanal-Bindings oder shairport-syncs Convolution-Filter),
# laeuft die Kette im Bypass: shairport-sync --> plug --> hw:0,0 (Amp4).
#
# Hinweis: "hw:0,0" direkt als Slave (nicht "plughw:0,0") - plughw ist
# selbst schon ein plug-Wrapper, und mehr als zwei verschachtelte
# plug-Schichten brechen die Parameter-Aushandlung ebenfalls.

pcm.plugequal_fixed {
    type plug
    slave.pcm "hw:0,0"
}

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}
